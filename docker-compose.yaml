services:
  app:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - app_storage:/app/storage
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4}
      - AUTH_USERNAME=${AUTH_USERNAME:-admin}
      - AUTH_PASSWORD=${AUTH_PASSWORD:-admin}
      - APIFREE_API_KEY=${APIFREE_API_KEY:-}
      - APIFREE_BASE_URL=${APIFREE_BASE_URL:-https://api.apifree.ai/v1}
      - MOCK_MODE=${MOCK_MODE:-false}
      - STORAGE_PATH=/app/storage
      - NODE_ENV=production
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default
      - coolify

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  app_storage:
  redis_data:

networks:
  coolify:
    external: true
